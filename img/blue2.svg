<text transform="matrix(1 0 0 1 -1940.3843 -446.9624)"><tspan x="0" y="0" fill="#444444" font-family="'NotoSansKR-Regular-KSCpc-EUC-H'" font-size="16">디자이너는 개인의 역량도 중요하지만 더 중요한 것은</tspan><tspan x="0" y="19.2" fill="#444444" font-family="'NotoSansKR-Regular-KSCpc-EUC-H'" font-size="16">원활한 소통과 팀원들과의 융화라고 생각합니다. </tspan><tspan x="0" y="38.4" fill="#444444" font-family="'NotoSansKR-Regular-KSCpc-EUC-H'" font-size="16">저의 개인의 역량으로 팀의 긍정적인 색으로 채워지는</tspan><tspan x="0" y="57.6" fill="#444444" font-family="'NotoSansKR-Regular-KSCpc-EUC-H'" font-size="16">다채로운 디자이너가 되고 싶습니다.</tspan></text>
