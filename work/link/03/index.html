<!doctype html>
<html>

<head>
	<meta charset="utf-8">
	<title>디자인03</title>

	<link href="img/mylogo.png" rel="shortcut icon" type="image/x-icon">
	<link rel="stylesheet" href="css/redesign.css" />

</head>

<style>
	* {
		margin: 0;
		padding: 0;
		box-sizing: border-box;
		outline-style: none;
	}

	ul,
	li {
		list-style: none;
	}

	img {
		border: 0;
		vertical-align: middle;
	}

	.wrap {
		display: flex;
		flex-direction: column;
		align-items: center;
		position: relative;
		max-width: 1920px;
		min-width: 0;
		width: 100%;
		margin: 0 auto;
	}

	.wrap img {
		/* width: 100% */
	}
</style>

<body>

	<div class="wrap">
		<img src="img/03img.jpg">
	</div>
</body>

</html>
